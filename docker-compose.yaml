services:
   
  db:
  
    image: postgres:17.2-alpine
    environment:
      - TZ=UTC
      - POSTGRES_PASSWORD=user
      - POSTGRES_USER=user
      - POSTGRES_DB=notes
    #  - POSTGRES_MULTIPLE_EXTENSIONS=postgis
    ports:
      - "6432:5432"
    healthcheck:
      test: "pg_isready -U user -d notes"
      interval: 5s
      timeout: 5s
      retries: 100
    #volumes:  # This must be a list
    #  - /home/tima/tima/Sources/golessons/audionotes/backups:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-02-09T21-25-16Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DOMAIN: minioS3
    entrypoint: sh

    command: |
      -c '
      mkdir -p /data/files &&
      minio server --console-address :9001 /data'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
      timeout: 5s

  kafka:
    image: apache/kafka-native:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  init-kafka:
    image: confluentinc/cp-kafka:7.3.2
    restart: on-failure
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      kafka-topics --bootstrap-server kafka:19092 --list
      
      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic image.events --replication-factor 1 --partitions 3

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:19092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8484:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  redis:
    image: redis:latest
    ports:
      - "6380:6379" 
  clickhouse-server:  
    image: clickhouse/clickhouse-server:24.8.4  
    ports:  
      - "8123:8123"  
      - "9000:9000" 
    environment:
      - CLICKHOUSE_ALLOW_DEPRECATED_SYNTAX_FOR_MERGE_TREE=1
   # volumes:
   #   - ./migrations/clickhouse:/docker-entrypoint-initdb.d

